name: Hoya Web CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-apk.yml"
      - ".github/workflows/release-android.yml"
      - "capacitor.config.json"
      - "index.html"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - "index.html"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate lesson content
        run: npm run validate:courses
      - name: Validate exercise bank
        run: npm run validate:exercises
      - name: Test progress rewards
        run: npm run test:progress
      - name: Test persisted-state validation
        run: npm run test:storage
      - name: Build web app
        run: npm run build
